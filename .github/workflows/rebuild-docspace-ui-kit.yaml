name: ReBuild docspace-ui-kit

run-name: "ReBuild docspace-ui-kit (${{ inputs.ui_kit_ref }})"

on:
  workflow_dispatch:
    inputs:
      ui_kit_ref:
        description: Branch or tag of docspace-ui-kit-react to build the pages from
        required: true
        default: master
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Checkout api.onlyoffice.com repository
        uses: actions/checkout@v4
        with:
          path: api.onlyoffice.com

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Checkout docspace-ui-kit-react repository
        uses: actions/checkout@v4
        with:
          repository: ONLYOFFICE/docspace-ui-kit-react
          token: ${{ secrets.READ_PAT }}
          ref: ${{ inputs.ui_kit_ref }}
          path: docspace-ui-kit-react

      - name: Set up Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build docspace-ui-kit-react pages
        env:
          CI: true
          DOCS_REVISION: ${{ inputs.ui_kit_ref }}
        run: |
          cd docspace-ui-kit-react
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm storybook-build
          pnpm docs:screenshots
          pnpm docs
          cd ..

          rm -rf api.onlyoffice.com/site/docspace/ui-kit/*
          cp -r docspace-ui-kit-react/site-docs/* api.onlyoffice.com/site/docspace/ui-kit/

          cd api.onlyoffice.com
          if [ -n "$(git status --porcelain)" ]; then
              git add .
              git commit -m "Update DocSpace UI Kit documentation from GitHub Actions"
              git push origin ${{ github.ref_name }}
            else
              echo "Nothing to commit"
            fi
