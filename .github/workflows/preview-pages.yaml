# A preview of the site on GitHub Pages, from a fork, built on a runner:
# run it by hand and the English site is served at
# https://<owner>.github.io/<repo>/. Once, in the fork: Settings -> Pages ->
# Source: "GitHub Actions" (the workflow's own token may not create the
# Pages site). noIndex stays on because site_mode is not production.
#
# The whole site does not build on GitHub's free 7 GB runner: the OpenAPI
# sections push it past that and the job is killed (exit 143). Until the
# fork has a larger runner, the preview is built locally and pushed to the
# gh-pages branch (the build/ directory as an orphan commit, with a
# .nojekyll file) with Pages set to "Deploy from a branch".
name: Preview on GitHub Pages
run-name: "Preview ${{ github.ref_name }} on GitHub Pages"

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build the site
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_URL: /${{ github.event.repository.name }}/
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          npm run generate-samples
          npm run generate-schema
          npx docusaurus build --locale en

      - name: Upload the build
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
